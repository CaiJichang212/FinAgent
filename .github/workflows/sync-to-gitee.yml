name: Sync to Gitee

on:
  push:
    branches: ['**']
  delete:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git remote add gitee https://oauth2:${GITEE_TOKEN}@gitee.com/luzhangchi/FinAgent.git
          git push --force --all gitee
          git push --force --tags gitee
